<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Central Study Book / Document Graphic -->
  <g filter="url(#shadow)" transform="translate(64, 80)">
    <!-- Back cover shadow -->
    <path d="M 32 280 C 120 250, 180 260, 192 270 C 204 260, 264 250, 352 280 L 352 80 C 264 50, 204 60, 192 70 C 180 60, 120 50, 32 80 Z" fill="#0f172a" opacity="0.3" transform="translate(0, 10)" />

    <!-- Open Book Pages (Left Page) -->
    <path d="M 40 80 C 120 56, 176 66, 188 76 L 188 276 C 176 266, 120 256, 40 280 Z" fill="url(#book)"/>
    
    <!-- Open Book Pages (Right Page) -->
    <path d="M 196 76 C 208 66, 264 56, 344 80 L 344 280 C 264 256, 208 266, 196 276 Z" fill="#e2e8f0"/>

    <!-- Spine -->
    <path d="M 188 76 Q 192 72 196 76 L 196 276 Q 192 272 188 276 Z" fill="#94a3b8"/>

    <!-- Left Page Text Lines -->
    <line x1="68" y1="120" x2="160" y2="120" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="68" y1="150" x2="160" y2="150" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="68" y1="180" x2="140" y2="180" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <line x1="68" y1="210" x2="155" y2="210" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>

    <!-- Right Page AI Sparkle / Citation Accent -->
    <line x1="224" y1="120" x2="316" y2="120" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <line x1="224" y1="150" x2="290" y2="150" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    <line x1="224" y1="180" x2="316" y2="180" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Sparkle Citation Star -->
    <path d="M 285 220 Q 285 240 305 240 Q 285 240 285 260 Q 285 240 265 240 Q 285 240 285 220 Z" fill="url(#glow)"/>
    <circle cx="315" cy="215" r="4" fill="#38bdf8"/>
  </g>

  <!-- Wordmark Text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">DrAG</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#93c5fd" text-anchor="middle" letter-spacing="2">AI STUDY &amp; DOCUMENT READER</text>
</svg>
